services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/skillgap
    depends_on:
      - mongodb

  frontend:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data: